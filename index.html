<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Calorie Guide</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Food Calorie Guide</h1>
            <p>Track your daily intake and stay on target.</p>
        </header>

        <section class="progress-section">
            <div class="stats">
                <div class="stat-item">
                    <span class="label">Total Calories</span>
                    <span id="total-calories" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Daily Goal</span>
                    <span class="value">2000 kcal</span>
                </div>
            </div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="progress-text">0% of daily goal</p>
        </section>

        <main class="main-grid">
            <section class="food-library">
                <h2>Food Library</h2>
                <div class="library-controls">
                    <label for="library-weight">Grams to add:</label>
                    <input type="number" id="library-weight" value="100" min="1">
                </div>
                <p class="subtitle">Click a food to add specific grams</p>
                <div id="food-list" class="food-list">
                    <!-- Foods will be rendered here -->
                </div>
            </section>

            <section class="consumption-log">
                <h2>Add to Today's Log</h2>
                
                <form id="smart-add-form" class="custom-add-form">
                    <div class="input-row">
                        <input type="text" id="smart-name" list="food-options" placeholder="What did you eat? (e.g. Apple)" required>
                        <datalist id="food-options">
                            <!-- Options will be populated by JS -->
                        </datalist>
                    </div>
                    <div class="input-row">
                        <input type="number" id="smart-grams" placeholder="Grams (e.g. 150)" required min="1">
                        <button type="submit" class="add-btn">Add to Log</button>
                    </div>
                </form>

                <div id="tracked-list" class="tracked-list">
                    <!-- Consumed foods will appear here -->
                    <div class="empty-msg">No foods added today.</div>
                </div>
                <button id="clear-all" class="clear-btn">Clear Everything</button>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Calorie Tracker | Simple & Private</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
